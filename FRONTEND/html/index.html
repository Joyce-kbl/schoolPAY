<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Guichet - SchoolPAY</title>
    <link rel="icon" href="/img/logoFat.jpeg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f8fafc; padding-bottom: 90px; }

        header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .branding { display: flex; align-items: center; gap: 12px; }
        .logo-circle { width: 45px; height: 45px; background: #8b0000; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; font-size: 14px; }
        .user-welcome { text-align: right; font-size: 13px; color: #64748b; }

        .content { display: flex; flex-direction: column; align-items: center; padding: 30px 20px 10px; }
        .home-circle { width: 80px; height: 80px; background: #8b0000; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 32px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(139,0,0,0.25); }

        .action-container { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 380px; }

        /* Recherche améliorée */
        .search-box { width: 100%; position: relative; }
        .search-input-full { width: 100%; padding: 14px 45px 14px 18px; border: 2px solid #e2e8f0; border-radius: 50px; font-size: 14px; outline: none; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.06); transition: border-color 0.2s; }
        .search-input-full:focus { border-color: #8b0000; }
        .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; cursor: pointer; }
        
        .search-results { width: 100%; background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 8px 20px rgba(0,0,0,0.1); overflow: hidden; display: none; margin-top: 5px; }
        .search-result-item { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: background 0.15s; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: #fef2f2; }
        .result-avatar { width: 38px; height: 38px; background: #8b0000; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .result-name { font-weight: 700; font-size: 14px; color: #1e293b; }
        .result-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
        .search-empty { padding: 20px; text-align: center; color: #94a3b8; font-size: 13px; }

        .btn-pay { display: flex; justify-content: center; align-items: center; background: #8b0000; color: white; padding: 15px 40px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; text-decoration: none; text-transform: uppercase; font-size: 15px; width: 100%; max-width: 380px; transition: background 0.2s; }
        .btn-pay:hover { background: #6b0000; }

        .section-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 20px 20px 10px; }
        .section-header h3 { font-size: 15px; color: #1e293b; font-weight: 700; }
        .section-header a { font-size: 12px; color: #8b0000; text-decoration: none; font-weight: 700; }

        .table-container { width: 100%; padding: 0 20px 20px; }
        .table-card { background: white; border-radius: 16px; padding: 15px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.04); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8fafc; padding: 10px 12px; border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 11px; text-transform: uppercase; text-align: left; }
        td { padding: 13px 12px; border-bottom: 1px solid #f1f5f9; }
        tr:last-child td { border-bottom: none; }
        .btn-reimprimer-recu {
            background: #8b0000;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-reimprimer-recu:hover { background: #6f0000; }

        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding: 0 10px; }
        .nav-link { text-decoration: none; color: #64748b; font-size: 11px; font-weight: 700; text-align: center; flex: 1; }
        .nav-link-home { text-decoration: none; }
        .home-icon-circle { width: 60px; height: 60px; background: #8b0000; color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 24px; box-shadow: 0 4px 10px rgba(139,0,0,0.4); margin-top: -30px; border: 4px solid #f8fafc; }

        /* === Adaptation écrans de téléphone (petits mobiles) === */
        @media (max-width: 380px) {
            header { padding: 12px 14px; }
            .content { padding: 20px 14px 10px; }
            .table-container { padding: 0 14px 14px; }
            table { font-size: 12px; }
        }
    </style>
</head>
<body>
<script src="/js/auth.js"></script>

<!-- Page d'accueil du guichet et affichage des transactions récentes -->
<!-- En-tête du guichet avec le logo, nom de l'application et déconnexion -->
<header>
    
    <div class="branding">
        <img src="/img/logoFat.jpeg" alt="Logo école" class="logo-circle">
        <div>
            <h2 style="color: #8b0000; font-size: 18px;">SchoolPAY</h2>
            <small style="color: #64748b; font-size: 11px;">Open Mind Tech</small>
        </div>
    </div>
    <div class="user-welcome">
        <p>Bonjour,</p>
        <strong id="nom-caissier-connecte" style="color: #1e293b;">—</strong>
        <div><a href="#" id="btn-deconnexion" style="font-size: 11px; color: #8b0000; text-decoration: none; font-weight: 700;">Déconnexion ↪</a></div>
    </div>
</header>

<div class="content">
    <img src="/img/logoFat.jpeg" alt="Logo école" class="home-circle">

    <!-- Zone d'action principale : recherche d'élève et lien vers la page de paiement -->
    <div class="action-container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input-full" placeholder="🔍  Rechercher un élève..." autocomplete="off">
            <span class="search-icon" id="search-clear" style="display:none; color:#94a3b8;" onclick="viderRecherche()">✕</span>
        </div>
        <div class="search-results" id="search-results"></div>

        <a href="paiement.html" class="btn-pay">➕ Nouveau Paiement</a>
    </div>
</div>

<!-- Section des transactions récentes affichées sur la page d'accueil -->
<div class="section-header">
    <h3>Transactions récentes</h3>
    <a href="eleves.html">Voir tous les élèves →</a>
    <button href="eleves.html">Voir tous les reçus →</button>
</div>

<div class="table-container">
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Élève</th>
                    <th>Libellé</th>
                    <th style="text-align: right;">Montant</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="liste-transactions"></tbody>
        </table>
    </div>
</div>

<nav class="nav-bottom no-print">
    <a href="journal de caisse.html" class="nav-link"><span style="font-size: 26px;">📒</span><br>Journal</a>
    <a href="index.html"><div class="home-icon-circle">🏠</div></a>
    <a href="modifier.html" class="nav-link"><span style="font-size: 26px;">⚙️</span><br>Paramètres</a>
</nav>

<script src="/js/app.js" defer></script>
<script>
const sessionActuelle = window.SchoolPayAuth?.obtenirSession();
if (sessionActuelle) {
    document.getElementById('nom-caissier-connecte').textContent = sessionActuelle.nom_complet;
}
document.getElementById('btn-deconnexion').addEventListener('click', function(e) {
    e.preventDefault();
    window.SchoolPayAuth?.deconnecter();
});

let rechercheTimer = null;

document.getElementById('search-input').addEventListener('input', function() {
    const val = this.value.trim();
    document.getElementById('search-clear').style.display = val ? 'block' : 'none';
    clearTimeout(rechercheTimer);
    if (val.length < 2) {
        masquerResultats();
        return;
    }
    rechercheTimer = setTimeout(() => lancerRecherche(val), 300);
});

document.getElementById('search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') viderRecherche();
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-box') && !e.target.closest('#search-results')) {
        masquerResultats();
    }
});

function viderRecherche() {
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').style.display = 'none';
    masquerResultats();
}

function masquerResultats() {
    const r = document.getElementById('search-results');
    r.style.display = 'none';
    r.innerHTML = '';
}

async function lancerRecherche(terme) {
    const resultatsDiv = document.getElementById('search-results');
    resultatsDiv.style.display = 'block';
    resultatsDiv.innerHTML = '<div class="search-empty">Recherche en cours...</div>';
    try {
        const res = await fetch(`/api/eleves?q=${encodeURIComponent(terme)}`);
        const data = await res.json();
        const eleves = data.donnees || [];
        if (eleves.length === 0) {
            resultatsDiv.innerHTML = '<div class="search-empty">Aucun élève trouvé pour "' + terme + '"</div>';
            return;
        }
        resultatsDiv.innerHTML = '';
        eleves.forEach(eleve => {
            const initiales = eleve.nom_complet.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            const item = document.createElement('div');
            item.className = 'search-result-item';
            item.innerHTML = `
                <div class="result-avatar">${initiales}</div>
                <div>
                    <div class="result-name">${eleve.nom_complet}</div>
                    <div class="result-meta">${eleve.nom_classe || 'Classe inconnue'} · ${eleve.matricule || '—'}</div>
                </div>
            `;
            item.addEventListener('click', () => {
                window.location.href = `fiche_eleve.html?id=${eleve.id}`;
            });
            resultatsDiv.appendChild(item);
        });
    } catch (err) {
        resultatsDiv.innerHTML = '<div class="search-empty">Erreur de connexion</div>';
    }
}
</script>
</body>
</html>
