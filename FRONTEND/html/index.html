<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Guichet - SchoolPAY</title>
    <link rel="icon" href="/img/logoFat.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<!-- Page d'accueil du guichet et affichage des transactions récentes -->
<!-- En-tête du guichet avec le logo, nom de l'application et déconnexion -->
<header>
    
    <div class="branding">
        <img src="/img/logoFat.jpeg" alt="Logo école" class="logo-circle">
        <div>
            <h2 style="color: #8b0000; font-size: 18px;">SchoolPAY</h2>
            <small style="color: #64748b; font-size: 11px;">Open Mind Tech</small>
        </div>
    </div>
    <div class="user-welcome">
        <p>Bonjour,</p>
        <strong id="nom-caissier-connecte" style="color: #1e293b;">—</strong>
        <div><a href="#" id="btn-deconnexion" style="font-size: 11px; color: #8b0000; text-decoration: none; font-weight: 700;">Déconnexion ↪</a></div>
    </div>
</header>

<div class="content">
    <img src="/img/logoFat.jpeg" alt="Logo école" class="home-circle">

    <!-- Zone d'action principale : recherche d'élève et lien vers la page de paiement -->
    <div class="action-container">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input-full" placeholder="🔍  Rechercher un élève..." autocomplete="off">
            <span class="search-icon" id="search-clear" style="display:none; color:#94a3b8;" onclick="viderRecherche()">✕</span>
        </div>
        <div class="search-results" id="search-results"></div>

        <a href="paiement.html" class="btn-pay">➕ Nouveau Paiement</a>
    </div>
</div>

<!-- Section des transactions récentes affichées sur la page d'accueil -->
<div class="section-header">
    <h3>Transactions récentes</h3>
    <a href="journal de caisse.html">Voir tout →</a>
</div>

<div class="table-container">
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Élève</th>
                    <th>Libellé</th>
                    <th style="text-align: right;">Montant</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="liste-transactions"></tbody>
        </table>
    </div>
</div>

<nav class="nav-bottom no-print">
    <a href="journal de caisse.html" class="nav-link"><span style="font-size: 26px;">📒</span><br>Journal</a>
    <a href="index.html"><div class="home-icon-circle">🏠</div></a>
    <a href="modifier.html" class="nav-link"><span style="font-size: 26px;">⚙️</span><br>Paramètres</a>
</nav>

<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
