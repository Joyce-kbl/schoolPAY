<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rapport de Caisse - Impression</title>
    <style>
        body { font-family: sans-serif; padding: 40px; color: #000; }
        
        /* En-tête du rapport */
        .header-print { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 20px; margin-bottom: 30px; }
        .logo-box { width: 80px; height: 80px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; }
        
        /* Tableau */
        table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        th { border-bottom: 2px solid #000; padding: 10px; text-align: left; }
        td { border-bottom: 1px solid #ccc; padding: 10px; }
        .total-row { font-weight: bold; border-top: 2px solid #000; }

        /* Signatures */
        .signatures { display: flex; justify-content: space-between; margin-top: 50px; }
        .sig-box { text-align: center; width: 200px; }
        .sig-line { border-top: 1px solid #000; margin-top: 60px; padding-top: 10px; }

        /* Masquer les éléments inutiles lors de l'impression */
        @media print { .no-print { display: none; } }
    </style>
</head>
<body>
<script src="/js/auth.js"></script>
<script src="/js/logs.js"></script>

    <!-- En-tête -->
<div class="header-print">
    <div style="display: flex; align-items: center; gap: 15px;">
        <!-- Remplacement du texte par ton image -->
        <img src="img/logoFat.jpeg" alt="Logo École" style="width: 80px; height: 80px; object-fit: contain;">
        <div>
            <h2 style="margin: 0; color: #8b0000;">ECOLE FATIMA</h2>
            <p style="margin: 0; font-size: 12px;">Kinshasa, RDC</p>
        </div>
    </div>
    
    <div style="text-align: right;">
        <p><strong>Date :</strong> 30 Juin 2026</p>
        <p>Rapport Journalier de Caisse</p>
    </div>
</div>

    <!-- Tableau -->
    <table>
        <thead>
            <tr>
                <th>N° Reçu</th>
                <th>Nom de l'élève</th>
                <th>Libellé</th>
                <th>Montant ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>R-001</td><td>Joyce Sala</td><td>Minerval L3</td><td>50,00</td></tr>
            <tr><td>R-002</td><td>Doudou K.</td><td>Inscription</td><td>20,00</td></tr>
            <tr class="total-row">
                <td colspan="3" style="text-align: right;">TOTAL DES RECETTES :</td>
                <td>70,00 $</td>
            </tr>
        </tbody>
    </table>

    <!-- Signatures -->
    <div class="signatures">
        <div class="sig-box">
            <p>Le Caissier</p>
            <div class="sig-line">Nom & Signature</div>
        </div>
        <div class="sig-box">
            <p>L'Économe</p>
            <div class="sig-line">Nom & Signature</div>
        </div>
    </div>

    <button class="no-print" onclick="if (window.enregistrerLog) { window.enregistrerLog('impression_rapport', 'detaille'); } window.print();" style="padding: 10px 20px; cursor: pointer;">🖨️ Imprimer le Rapport</button>

</body>
</html>
