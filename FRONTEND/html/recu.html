<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolPAY - Reçu</title>
  <link rel="icon" href="/img/logoFat.jpeg" type="image/jpeg">
  <style>
    :root { --primary: #8b0000; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #1e293b; }
    .top-nav { background: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
    .back-btn { text-decoration: none; color: var(--primary); font-size: 22px; font-weight: bold; padding: 4px 8px; border-radius: 8px; }
    .nav-title { color: var(--primary); font-size: 16px; font-weight: 700; }
    .page-wrapper { padding: 20px; max-width: 520px; margin: 0 auto; }
    .recu-sheet { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 12px; }
    .recu-header { background: var(--primary); color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
    .recu-logo { width: 44px; height: 44px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--primary); font-size: 14px; flex-shrink: 0; }
    .recu-school { font-size: 14px; font-weight: 800; }
    .recu-subtitle { font-size: 10px; opacity: 0.85; margin-top: 1px; }
    .recu-numero-badge { margin-left: auto; background: rgba(255,255,255,0.2); border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .recu-body { padding: 14px 20px; }
    .recu-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
    .recu-row:last-child { border-bottom: none; }
    .recu-key { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .recu-val { font-size: 13px; color: #1e293b; font-weight: 600; text-align: right; max-width: 60%; }
    .recu-montant { background: #fef2f2; border-radius: 10px; padding: 10px 16px; margin: 8px 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .montant-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; }
    .montant-valeur { font-size: 20px; font-weight: 900; color: var(--primary); }
    .montant-lettres { font-size: 9px; color: #64748b; font-style: italic; width: 100%; text-align: right; margin-top: 2px; }
    .recu-footer { padding: 12px 20px; background: #f8fafc; display: flex; justify-content: space-between; gap: 16px; }
    .sig-block { flex: 1; text-align: center; }
    .sig-label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-bottom: 28px; }
    .sig-line { border-top: 1.5px solid #cbd5e1; padding-top: 4px; font-size: 10px; color: #94a3b8; }
    .actions { margin-top: 20px; display: grid; gap: 10px; }
    .btn-print-main, .btn-secondary {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-print-main { background: var(--primary); color: #fff; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .etat { margin: 12px 0 0; font-size: 13px; color: #64748b; min-height: 18px; }
    @media print {
      @page { size: A5 portrait; margin: 4mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .no-print { display: none !important; }
      body { background: white; }
      .page-wrapper { width: 100%; max-width: none; padding: 0; }
      .recu-sheet { border-radius: 0; box-shadow: none; border: 1px solid #bbb; page-break-inside: avoid; break-inside: avoid; }
      .recu-header { padding: 5px 8px; gap: 6px; }
      .recu-logo { width: 28px; height: 28px; }
      .recu-school { font-size: 11px; }
      .recu-subtitle { font-size: 8px; }
      .recu-numero-badge { font-size: 8px; padding: 2px 5px; }
      .recu-body { padding: 6px 10px; }
      .recu-row { padding: 2.5px 0; }
      .recu-key { font-size: 8px; }
      .recu-val { font-size: 10px; }
      .recu-montant { padding: 5px 10px; margin: 3px 0 8px; border-radius: 4px; }
      .montant-label { font-size: 7px; }
      .montant-valeur { font-size: 16px; }
      .montant-lettres { font-size: 7px; margin-top: 2px; }
      .sig-label { font-size: 7px; margin-bottom: 10px; }
      .sig-line { font-size: 7px; }
    }
  </style>
</head>
<body>
  <script src="/js/auth.js"></script>
  <div class="no-print">
    <div class="top-nav">
      <a href="index.html" class="back-btn">←</a>
      <span class="nav-title">Reçu de Paiement</span>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="recu-sheet">
      <div class="recu-header">
        <img class="recu-logo" src="/img/logoFat.jpeg" alt="Logo">
        <div>
          <div class="recu-school" id="nom-ecole">SchoolPAY</div>
          <div class="recu-subtitle">Reçu de Paiement</div>
        </div>
        <div class="recu-numero-badge" id="numero-recu">N° ...</div>
      </div>

      <div class="recu-body">
        <div class="recu-montant">
          <div style="width:100%">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="montant-label">Montant payé</span>
              <span class="montant-valeur" id="montant">—</span>
            </div>
            <div class="montant-lettres" id="montant-lettres"></div>
          </div>
        </div>

        <div class="recu-row"><span class="recu-key">Élève</span><span class="recu-val" id="nom-eleve">—</span></div>
        <div class="recu-row"><span class="recu-key">Matricule</span><span class="recu-val" id="matricule">—</span></div>
        <div class="recu-row"><span class="recu-key">Classe</span><span class="recu-val" id="classe">—</span></div>
        <div class="recu-row"><span class="recu-key">Libellé</span><span class="recu-val" id="libelle">—</span></div>
        <div class="recu-row"><span class="recu-key">Date</span><span class="recu-val" id="date">—</span></div>
        <div class="recu-row"><span class="recu-key">Caissier(e)</span><span class="recu-val" id="caissier">—</span></div>
      </div>

      <div class="recu-footer">
        <div class="sig-block">
          <div class="sig-label">Caissier(e)</div>
          <div class="sig-line" id="sig-caissier">Signature</div>
        </div>
        <div class="sig-block">
          <div class="sig-label">Déposant</div>
          <div class="sig-line" id="sig-deposant">Signature</div>
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="btn-print-main" type="button" id="btn-imprimer">🖨️ Imprimer le reçu</button>
      <a href="index.html" class="btn-secondary">← Retour à l'accueil</a>
      <div class="etat" id="etat"></div>
    </div>
  </div>

  <script>
    function nombreEnLettres(n) {
      const entiers = ['zero','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
      const dizaines = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
      const entier = Math.floor(n);
      const centimes = Math.round((n - entier) * 100);
      function convertir(nb) {
        if (nb < 20) return entiers[nb];
        if (nb < 100) {
          const d = Math.floor(nb / 10);
          const u = nb % 10;
          if (d === 7 || d === 9) return dizaines[d] + (u === 1 ? '-et-' : '-') + entiers[10 + u];
          return dizaines[d] + (u > 0 ? (u === 1 && d !== 8 ? '-et-un' : '-' + entiers[u]) : (d === 8 ? 's' : ''));
        }
        return String(nb);
      }
      let texte = convertir(entier) + ' dollar(s)';
      if (centimes > 0) texte += ' et ' + convertir(centimes) + ' centime(s)';
      return texte.charAt(0).toUpperCase() + texte.slice(1);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const parties = String(dateStr).slice(0, 10).split('-');
      if (parties.length !== 3) return dateStr;
      return `${parties[2]}/${parties[1]}/${parties[0]}`;
    }

    function setTexte(id, valeur) {
      const element = document.getElementById(id);
      if (element) element.textContent = valeur;
    }

    async function chargerRecu() {
      const params = new URLSearchParams(window.location.search);
      const numero = params.get('numero');
      const etat = document.getElementById('etat');

      if (!numero) {
        if (etat) etat.textContent = 'Numéro de reçu manquant.';
        return;
      }

      try {
        const reponse = await fetch(`/api/recu?numero=${encodeURIComponent(numero)}`);
        const json = await reponse.json();
        const data = json.donnees;

        if (!reponse.ok || !data) {
          throw new Error(json.erreur || 'Reçu introuvable');
        }

        setTexte('numero-recu', `N° ${data.numero_recu || numero}`);
        setTexte('montant', `${Number(data.montant || 0).toFixed(2)} $`);
        setTexte('montant-lettres', nombreEnLettres(Number(data.montant || 0)));
        setTexte('nom-eleve', data.nom_eleve || '—');
        setTexte('matricule', data.matricule || '—');
        setTexte('classe', data.nom_classe || '—');
        setTexte('libelle', data.libelle || '—');
        setTexte('date', formatDate(data.paye_le));
        setTexte('caissier', data.caissier || '—');
        setTexte('sig-caissier', data.caissier || 'Signature');
        setTexte('sig-deposant', data.nom_eleve || 'Signature');

        if (params.get('auto_print') === '1') {
          setTimeout(() => window.print(), 500);
        }
      } catch (erreur) {
        if (etat) etat.textContent = erreur.message;
      }
    }

    document.getElementById('btn-imprimer')?.addEventListener('click', () => window.print());
    chargerRecu();
  </script>
</body>
</html>
