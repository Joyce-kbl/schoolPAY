<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Situation Générale - SchoolPAY</title>
    <link rel="icon" href="/img/logoFat.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="/css/situation.css">
</head>
<body>
<script src="/js/auth.js"></script>
<script src="/js/logs.js"></script>

<!-- Page de situation générale, synthèse globale des paiements par classe -->
<!-- Cette page affiche un rapport synthétique des paiements par classe et par période -->
<header class="no-print">
    <a href="modifier.html" class="back-btn">←</a>
    <h2 style="color: var(--primary); font-size: 16px;">Situation Générale des Élèves</h2>
</header>

<div class="container">
    <div class="print-header">
        <img src="/img/logoFat.jpeg" alt="Logo école" class="logo-circle">
        <div>
            <div class="ecole-nom" id="ph-ecole">ÉCOLE MATERNELLE FATIMA</div>
            <div style="font-size:11px;color:#444;" id="ph-adresse">Kinshasa, RDC</div>
        </div>
        <div class="periode-info">
            <strong>Situation Générale des Paiements</strong><br>
            <span id="ph-periode">—</span><br>
            Imprimé le <span id="ph-date-impression">—</span>
        </div>
    </div>

    <!-- Bloc filtre visible seulement sur écran : permet de générer le rapport selon classe, période et année -->
    <div class="card no-print">
        <div class="card-title">🔎 Filtres</div>
        <label>Classe</label>
        <select id="filtre-classe">
            <option value="all">Toutes les classes</option>
        </select>
        <label>Période</label>
        <select id="filtre-periode">
            <option value="annuel">Année scolaire complète</option>
            <option value="trimestre1">1er trimestre</option>
            <option value="trimestre2">2e trimestre</option>
            <option value="trimestre3">3e trimestre</option>
        </select>
        <label>Année scolaire (début, ex: 2026 pour 2026-2027)</label>
        <input type="number" id="filtre-annee" placeholder="2026">
        <button class="btn-action" onclick="chargerSituation()">Générer le rapport</button>
    </div>

    <!-- Zone de résultats du rapport généré, remplacée dynamiquement par les données renvoyées par l'API -->
    <div id="resultats" class="card">
        <div class="loading">Sélectionnez vos filtres puis générez le rapport.</div>
    </div>

    <!-- Bouton d'impression de la situation générale visible uniquement à l'écran -->
    <div class="no-print" style="display:flex; gap:10px;">
        <button class="btn-action" style="background:#1e293b;" onclick="window.print()">🖨️ Imprimer la situation générale</button>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/logs.js"></script>
<script src="/js/app.js"></script>
<script src="/js/situation.js"></script>
</body>
</html>
