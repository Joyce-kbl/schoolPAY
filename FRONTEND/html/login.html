<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SchoolPAY</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<!-- Page de connexion du caissier -->
<div class="login-card">
    <img src="/img/logoFat.jpeg" alt="Logo école" class="login-logo">
    <div class="login-title">SchoolPAY</div>
    <div class="login-subtitle">Espace caissier — Connexion requise</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" autocomplete="off">
        <div class="form-group">
            <label>Identifiant</label>
            <input id="nom-utilisateur" type="text" class="form-control" placeholder="ex : sala joyce" required>
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input id="mot-de-passe" type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Se connecter</button>
    </form>

    <div class="footer-note">Open Mind Tech · SchoolPAY</div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
