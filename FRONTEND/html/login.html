<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SchoolPAY</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
    <style>
        :root { --primary: #8b0000; --bg: #f8fafc; --white: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(160deg, #8b0000 0%, #5c0000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 36px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            text-align: center;
        }
        .login-logo { width: 72px; height: 72px; margin: 0 auto 14px; display: block; }
        .login-title { font-size: 20px; font-weight: 800; color: var(--primary); }
        .login-subtitle { font-size: 12px; color: #64748b; margin-top: 4px; margin-bottom: 26px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .form-control { width: 100%; padding: 13px 15px; border: 1.5px solid #e2e8f0; border-radius: 12px; background: #fdfdfd; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-control:focus { border-color: var(--primary); }
        .btn-login { background: var(--primary); color: white; padding: 15px; border-radius: 14px; border: none; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; margin-top: 8px; transition: background 0.2s; }
        .btn-login:hover { background: #6b0000; }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; }
        .error-msg { background: #fef2f2; color: #b91c1c; border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; text-align: left; }
        .footer-note { margin-top: 22px; font-size: 11px; color: #94a3b8; }

        /* Petits téléphones : on réduit le padding de la carte pour ne pas gaspiller d'espace */
        @media (max-width: 360px) {
            .login-card { padding: 26px 18px; }
        }
    </style>
</head>
<body>

<!-- Page de connexion du caissier -->
<div class="login-card">
    <img src="/img/logoFat.jpeg" alt="Logo école" class="login-logo">
    <div class="login-title">SchoolPAY</div>
    <div class="login-subtitle">Espace caissier — Connexion requise</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" autocomplete="off">
        <div class="form-group">
            <label>Identifiant</label>
            <input id="nom-utilisateur" type="text" class="form-control" placeholder="ex : sala joyce" required>
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input id="mot-de-passe" type="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Se connecter</button>
    </form>

    <div class="footer-note">Open Mind Tech · SchoolPAY</div>
</div>

<!-- Script local de gestion du formulaire de connexion -->
<script>
const params = new URLSearchParams(window.location.search);
const next = params.get('next') || 'index.html';

// Si deja connecte, on saute directement a la page demandee.
try {
    const session = JSON.parse(localStorage.getItem('schoolpay_session') || 'null');
    if (session && session.nom_complet) {
        window.location.replace(next);
    }
} catch (e) {}

document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const nom_utilisateur = document.getElementById('nom-utilisateur').value.trim();
    const mot_de_passe = document.getElementById('mot-de-passe').value;
    const erreurDiv = document.getElementById('error-msg');
    const bouton = document.getElementById('btn-login');

    erreurDiv.style.display = 'none';
    bouton.disabled = true;
    bouton.textContent = 'Connexion...';

    try {
        const res = await fetch('/api/connexion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nom_utilisateur, mot_de_passe })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.erreur || 'Erreur de connexion');

        localStorage.setItem('schoolpay_session', JSON.stringify(data.donnees));
        window.location.href = next;
    } catch (err) {
        erreurDiv.textContent = err.message;
        erreurDiv.style.display = 'block';
        bouton.disabled = false;
        bouton.textContent = 'Se connecter';
    }
});
</script>
</body>
</html>
