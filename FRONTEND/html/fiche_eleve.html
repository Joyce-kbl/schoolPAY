<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolPAY - Fiche Élève</title>
    <link rel="icon" href="/img/logoFat.jpeg" type="image/jpeg">
    <style>
        :root { --primary: #8b0000; --bg: #f8fafc; --white: #ffffff; --success: #059669; --danger: #dc2626; --warning: #d97706; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { background-color: var(--bg); padding-bottom: 30px; }

        header { background: var(--white); padding: 15px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .back-btn { text-decoration: none; color: var(--primary); font-size: 22px; font-weight: bold; padding: 4px 8px; border-radius: 8px; transition: background 0.15s; }
        .back-btn:hover { background: #fef2f2; }

        .container { padding: 20px; max-width: 480px; margin: 0 auto; }

        /* Carte profil élève */
        .profile-card { background: var(--primary); border-radius: 20px; padding: 24px; color: white; margin-bottom: 20px; position: relative; overflow: hidden; }
        .profile-card::before { content: ''; position: absolute; top: -30px; right: -30px; width: 120px; height: 120px; background: rgba(255,255,255,0.08); border-radius: 50%; }
        .profile-avatar { width: 56px; height: 56px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; margin-bottom: 12px; }
        .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .profile-meta { font-size: 12px; opacity: 0.8; display: flex; gap: 12px; }
        .profile-badge { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }

        /* Stats */
        .grid-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--white); padding: 15px 10px; border-radius: 14px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .stat-value { font-size: 16px; font-weight: 900; display: block; }
        .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-top: 3px; }

        /* Barre de progression */
        .progress-card { background: var(--white); border-radius: 14px; padding: 18px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .progress-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #64748b; font-weight: 700; }
        .progress-bar { height: 10px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #059669, #10b981); border-radius: 99px; transition: width 1s ease; }
        .progress-fill.danger { background: linear-gradient(90deg, #dc2626, #f87171); }
        .progress-fill.warning { background: linear-gradient(90deg, #d97706, #fbbf24); }

        /* Tableau historique */
        .table-card { background: var(--white); border-radius: 16px; padding: 18px; border: 1px solid #e2e8f0; }
        .table-title { font-weight: 800; margin-bottom: 14px; font-size: 14px; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; color: #64748b; padding: 8px 6px; border-bottom: 1.5px solid #f1f5f9; font-size: 11px; text-transform: uppercase; }
        td { padding: 12px 6px; border-bottom: 1px solid #f8fafc; }
        tr:last-child td { border-bottom: none; }
        .badge-libelle { background: #f1f5f9; color: #475569; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; }

        .btn-pay-more { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); color: white; padding: 15px; border-radius: 14px; border: none; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; text-decoration: none; margin-top: 16px; }

        .empty-state { text-align: center; padding: 30px 20px; color: #94a3b8; }
        .loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }

        /* En-tête imprimé (masqué à l'écran, visible uniquement sur le papier) */
        .print-header { display: none; }

        @media print {
            @page { margin: 14mm 12mm; }
            .no-print { display: none !important; }
            body { background: white; }

            /* En-tête professionnel avec logo, nom de l'école et date d'impression */
            .print-header {
                display: flex; align-items: center; gap: 14px;
                border-bottom: 2px solid #8b0000; padding-bottom: 14px; margin-bottom: 18px;
            }
            .print-header img { width: 56px; height: 56px; object-fit: contain; }
            .print-header .ph-ecole { font-size: 16px; font-weight: 800; color: #8b0000; }
            .print-header .ph-sous-titre { font-size: 11px; color: #444; }
            .print-header .ph-date { margin-left: auto; text-align: right; font-size: 11px; color: #444; }

            .container { max-width: 100%; padding: 0; }
            .profile-card { background: white !important; color: #000 !important; border: 1.5px solid #8b0000; border-radius: 10px; box-shadow: none; }
            .profile-card::before { display: none; }
            .profile-avatar { background: #f1f5f9 !important; color: #8b0000; }
            .grid-stats, .progress-card { break-inside: avoid; }
            .table-card { border: 1px solid #cbd5e1; box-shadow: none; break-inside: avoid; }
            .table-card + .table-card { margin-top: 14px; }
            table { font-size: 11px; }
            th { border-bottom: 1.5px solid #000; color: #000; }
            td { border-bottom: 1px solid #cbd5e1; }
            .badge-libelle { background: none; border: 1px solid #cbd5e1; }
        }

        /* Conteneur scrollable horizontal pour les tableaux sur petits écrans (téléphones) */
        .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* === Adaptation écrans de téléphone (petits mobiles) === */
        @media (max-width: 380px) {
            .container { padding: 14px; }
            .profile-card { padding: 18px; }
            .profile-name { font-size: 17px; }
            .grid-stats { gap: 6px; }
            table { font-size: 11px; }
            th, td { padding: 8px 4px; }
        }
    </style>
</head>
<body>
<script src="/js/auth.js"></script>

<!-- Page de fiche élève affichant le profil, les soldes et l'historique de paiement -->
<!-- Affichage du profil de l'élève et de son historique de paiements -->
<header class="no-print">
    <a href="javascript:history.back()" class="back-btn">←</a>
    <h2 style="color: var(--primary); font-size: 16px; font-weight: 700;">Fiche Élève</h2>
</header>

<!-- En-tête imprimé uniquement (logo, nom de l'école, date d'impression) : rend le relevé plus lisible et officiel -->
<!-- Placé hors du conteneur dynamique afin de ne pas être écrasé lors du rendu des données -->
<div class="print-header">
    <img src="/img/logoFat.jpeg" alt="Logo">
    <div>
        <div class="ph-ecole" id="ph-ecole">ÉCOLE FATIMA</div>
        <div class="ph-sous-titre" id="ph-adresse">Kinshasa, RDC</div>
    </div>
    <div class="ph-date">
        <strong>Relevé de compte élève</strong><br>
        Imprimé le <span id="ph-date-impression">—</span>
    </div>
</div>

<!-- Conteneur principal de la fiche élève : mis à jour dynamiquement par JavaScript -->
<div class="container" id="main-container">
    <div class="loading">Chargement...</div>
</div>

<script>
function formatMonnaie(val) {
    const s = '$';
    return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(val) + ' ' + s;
}
function formatDate(d) {
    if (!d) return '—';
    const dt = new Date(d);
    return isNaN(dt) ? d : dt.toLocaleDateString('fr-FR');
}

/**
 * Charge le nom et l'adresse de l'école pour les afficher dans l'en-tête imprimé du relevé.
 * En cas d'échec, les valeurs par défaut déjà présentes dans le HTML restent affichées.
 */
async function chargerParametresEcole() {
    try {
        const res = await fetch('/api/parametres');
        const json = await res.json();
        if (json.donnees?.nom_ecole) document.getElementById('ph-ecole').textContent = json.donnees.nom_ecole;
        if (json.donnees?.adresse_ecole) document.getElementById('ph-adresse').textContent = json.donnees.adresse_ecole;
    } catch (e) { /* on garde les valeurs par defaut */ }
    document.getElementById('ph-date-impression').textContent = new Date().toLocaleDateString('fr-FR');
}

async function chargerFiche() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('main-container');

    if (!id) {
        container.innerHTML = '<div class="empty-state">❌ Aucun élève sélectionné.<br><a href="index.html">← Retour</a></div>';
        return;
    }

    try {
        const res = await fetch(`/api/eleves/${id}/fiche`);
        if (!res.ok) throw new Error('Élève introuvable');
        const data = (await res.json()).donnees;

        const { eleve, paiements, soldes, total_paye, frais_total, reste } = data;
        const pct = frais_total > 0 ? Math.min(100, (total_paye / frais_total) * 100) : 0;
        const initiales = eleve.nom_complet.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
        const sexeLabel = eleve.sexe === 'M' ? '👦 Masculin' : eleve.sexe === 'F' ? '👧 Féminin' : '—';
        
        let progressClass = 'danger';
        if (pct >= 80) progressClass = '';
        else if (pct >= 40) progressClass = 'warning';

        const historiqueHTML = paiements.length === 0
            ? '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">Aucun paiement enregistré</td></tr>'
            : paiements.map(p => `
                <tr>
                    <td style="color:#64748b;font-size:12px;">${formatDate(p.paye_le)}</td>
                    <td><span class="badge-libelle">${p.libelle}</span></td>
                    <td style="color:#64748b;font-size:12px;">${p.caissier || '—'}</td>
                    <td style="text-align:right;font-weight:700;color:#1e293b;">${formatMonnaie(p.montant)}</td>
                </tr>
            `).join('');

        const soldesHTML = (!soldes || soldes.length === 0)
            ? '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:20px;">Aucun frais attendu défini pour cette classe</td></tr>'
            : soldes.map(s => {
                const isPayed = s.reste <= 0;
                const statusColor = isPayed ? 'var(--success)' : 'var(--danger)';
                return `
                <tr>
                    <td style="font-weight:600; color:#1e293b;">${s.categorie}</td>
                    <td>${formatMonnaie(s.attendu)}</td>
                    <td style="color:var(--success);">${formatMonnaie(s.paye)}</td>
                    <td style="text-align:right;font-weight:700;color:${statusColor};">${formatMonnaie(s.reste)}</td>
                </tr>`;
            }).join('');

        container.innerHTML = `
            <div class="profile-card">
                <div class="profile-avatar">${initiales}</div>
                <div class="profile-name">${eleve.nom_complet}</div>
                <div class="profile-meta">
                    <span>${eleve.matricule || '—'}</span>
                    <span class="profile-badge">${eleve.nom_classe || 'Classe inconnue'}</span>
                    <span>${sexeLabel}</span>
                </div>
            </div>

            <div class="table-card" style="margin-bottom: 20px;">
                <div class="table-title">💰 Soldes à payer</div>
                <div class="table-scroll">
                <table>
                    <thead><tr><th>Catégorie</th><th>Attendu</th><th>Payé</th><th style="text-align:right;">Reste</th></tr></thead>
                    <tbody>${soldesHTML}</tbody>
                </table>
                </div>
            </div>

            <div class="progress-card">
                <div class="progress-label">
                    <span>Frais scolaires (${formatMonnaie(total_paye)} / ${formatMonnaie(frais_total)})</span>
                    <span style="color:${pct >= 80 ? 'var(--success)' : pct >= 40 ? 'var(--warning)' : 'var(--danger)'};">${pct.toFixed(0)}%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill ${progressClass}" style="width: ${pct}%;"></div>
                </div>
                <div style="font-size: 10px; color: #94a3b8; margin-top: 8px;">Les frais annexes ne sont pas comptés ici ; voir le tableau des soldes et l'historique ci-dessous.</div>
            </div>

            <div class="table-card">
                <div class="table-title">📄 Historique des paiements <span style="background:#fef2f2;color:#8b0000;border-radius:20px;padding:2px 10px;font-size:11px;">${paiements.length}</span></div>
                <div class="table-scroll">
                <table>
                    <thead><tr><th>Date</th><th>Libellé</th><th>Caissier(e)</th><th style="text-align:right;">Montant</th></tr></thead>
                    <tbody>${historiqueHTML}</tbody>
                </table>
                </div>
            </div>

            <div class="no-print" style="display:flex; gap: 10px; margin-top: 16px;">
                <button onclick="window.print()" style="flex:1; background:#1e293b; color:white; padding:15px; border-radius:14px; border:none; font-weight:bold; cursor:pointer; font-size:14px;">🖨️ Imprimer le relevé</button>
            </div>
            <a href="paiement.html?eleve_id=${eleve.id}" class="btn-pay-more no-print">➕ Effectuer un paiement</a>
        `;
    } catch(err) {
        container.innerHTML = `<div class="empty-state">❌ ${err.message}<br><br><a href="index.html" style="color:#8b0000;font-weight:700;">← Retour à l'accueil</a></div>`;
    }
}

chargerFiche();
chargerParametresEcole();

document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        window.print();
    }
});
</script>
</body>
</html>
